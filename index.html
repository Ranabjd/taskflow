<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow - Nouvelle tâche</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <h2>Créer une nouvelle tâche</h2>
    <form action="addTask.php" method="post">

        <!-- Titre de la tâche -->
        <label for="title">Titre de la tâche :</label><br>
        <input type="text" id="title" name="title" required><br><br>

        <!-- Description -->
        <label for="description">Description :</label><br>
        <textarea id="description" name="description" rows="4" cols="30"></textarea><br><br>

        <!-- Priorité -->
        <label for="priority">Priorité :</label><br>
        <select id="priority" name="priority">
            <option value="basse">Basse</option>
            <option value="moyenne">Moyenne</option>
            <option value="haute">Haute</option>
        </select><br><br>

        <!-- Date limite -->
        <label for="deadline">Date limite :</label><br>
        <input type="date" id="deadline" name="deadline"><br><br>

        <!-- Statut -->
        <label for="status">Statut :</label><br>
        <select id="status" name="status">
            <option value="a_faire">À faire</option>
            <option value="en_cours">En cours</option>
            <option value="terminee">Terminée</option>
        </select><br><br>

        <!-- Bouton -->
        <input type="submit" value="Ajouter la tâche">

    </form>

</body>
</html>
